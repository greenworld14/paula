<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <defs>
    <radialGradient id="g1" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#818CF8" stop-opacity=".5"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity=".14"/></pattern>
  </defs>
  <rect width="480" height="320" fill="#0B1224"/>
  <rect width="480" height="320" fill="url(#dots)"/>
  <rect width="480" height="320" fill="url(#g1)"/>
  <rect width="480" height="320" fill="url(#g2)"/>

  <!-- feedback loop -->
  <circle cx="370" cy="160" r="92" fill="none" stroke="url(#loop)" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/>
  <path d="M438 110l10 -18 6 22z" fill="#818CF8"/>
  <path d="M302 210l-10 18 -6 -22z" fill="#5EEAD4"/>
  <circle cx="370" cy="160" r="42" fill="#111A2E" stroke="#2A3858" stroke-width="2"/>
  <g fill="#5EEAD4"><circle cx="356" cy="148" r="5"/><circle cx="384" cy="148" r="5"/><circle cx="370" cy="174" r="5"/></g>
  <path d="M356 148L384 148L370 174Z" fill="none" stroke="#5EEAD4" stroke-width="2"/>

  <!-- response A -->
  <rect x="30" y="44" width="230" height="92" rx="16" fill="#111A2E" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5EEAD4">RESPONSE A</text>
  <rect x="48" y="84" width="170" height="8" rx="4" fill="#2A3858"/>
  <rect x="48" y="100" width="140" height="8" rx="4" fill="#2A3858"/>
  <rect x="48" y="116" width="96" height="8" rx="4" fill="#2A3858"/>
  <circle cx="232" cy="66" r="14" fill="#5EEAD4"/>
  <path d="M225 66l5 5 9-10" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- response B -->
  <rect x="30" y="156" width="230" height="92" rx="16" fill="#111A2E" stroke="#2A3858" stroke-width="1.5"/>
  <text x="48" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#64728C">RESPONSE B</text>
  <rect x="48" y="196" width="150" height="8" rx="4" fill="#1C2740"/>
  <rect x="48" y="212" width="176" height="8" rx="4" fill="#1C2740"/>
  <rect x="48" y="228" width="80" height="8" rx="4" fill="#1C2740"/>
  <circle cx="232" cy="178" r="14" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M226 172l12 12M238 172l-12 12" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- reward bars -->
  <g transform="translate(30 268)">
    <rect width="230" height="10" rx="5" fill="#1C2740"/>
    <rect width="176" height="10" rx="5" fill="url(#loop)"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">REWARD</text>
  </g>
</svg>
