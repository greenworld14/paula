    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text x="16" y="30" fill="#818CF8">GET</text><text x="52" y="30" fill="#94A3B8">/api/orders</text>
      <text x="16" y="56" fill="#5EEAD4">200</text><text x="52" y="56" fill="#64728C">OK · 42ms</text>
      <text x="16" y="82" fill="#38BDF8">POST</text><text x="60" y="82" fill="#94A3B8">/checkout</text>
