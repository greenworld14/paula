    <path d="M190 120C300 20 400 30 470 70" stroke="#5EEAD4"/>
    <path d="M140 140C300 200 520 190 640 120" stroke="#818CF8"/>
  </g>
  <!-- browser window -->
  <g transform="translate(470 38)">
    <rect width="220" height="130" rx="12" fill="#111A2E" stroke="#2A3858"/>
    <path d="M0 26H220" stroke="#2A3858"/>
    <circle cx="16" cy="13" r="4" fill="#F87171"/><circle cx="30" cy="13" r="4" fill="#FBBF24"/><circle cx="44" cy="13" r="4" fill="#34D399"/>
    <rect x="16" y="42" width="90" height="10" rx="5" fill="#E7ECF5" fill-opacity=".75"/>
    <rect x="16" y="62" width="130" height="7" rx="3.5" fill="#2A3858"/>
    <rect x="16" y="76" width="110" height="7" rx="3.5" fill="#2A3858"/>
