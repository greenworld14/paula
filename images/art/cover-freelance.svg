<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1224"/><stop offset="1" stop-color="#0F1A30"/></linearGradient>
    <radialGradient id="g1" cx="20%" cy="0%" r="60%"><stop offset="0" stop-color="#38BDF8" stop-opacity=".4"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="100%" r="60%"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="200" fill="url(#bg)"/>
  <rect width="960" height="200" fill="url(#g1)"/>
  <rect width="960" height="200" fill="url(#g2)"/>
  <!-- globe -->
  <g transform="translate(150 100)" fill="none" stroke="#38BDF8" stroke-opacity=".6" stroke-width="1.5">
    <circle r="72"/>
    <ellipse rx="30" ry="72"/><ellipse rx="58" ry="72"/>
    <path d="M-72 0H72M-64 -34H64M-64 34H64"/>
  </g>
  <g fill="#5EEAD4"><circle cx="118" cy="72" r="5"/><circle cx="190" cy="120" r="5"/><circle cx="140" cy="140" r="5"/></g>
  <!-- connection arcs -->
